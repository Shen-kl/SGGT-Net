<text x="795.0" y="408.0" class="small" text-anchor="middle">RMSE reduction (m)</text>
<text x="500.0" y="468.0" class="small" text-anchor="middle">Strong-maneuver gains exceed steady-motion gains for both prior prediction and posterior update.</text>
