<line x1="802.3" y1="247.0" x2="802.3" y2="259.0" stroke="#1e40af" stroke-width="2"/>
<line x1="893.8" y1="247.0" x2="893.8" y2="259.0" stroke="#1e40af" stroke-width="2"/>
<circle cx="847.2" cy="253.0" r="6" fill="#2563eb"/>
